<mat-toolbar>
  <a class="brand" routerLink="/">Cargo Compliance Gate</a>
  @if (user(); as session) {
    <a mat-button routerLink="/shipments">Shipments</a>
    <a mat-button routerLink="/shipments/new">Submit</a>
    @if (isAnalyst()) {
      <a mat-button routerLink="/holds">Hold queue</a>
    }
    <span class="spacer"></span>
    <span class="session">{{ session.username }} ({{ session.roles.join(", ") }})</span>
    <button mat-button type="button" (click)="logout()">Log out</button>
  }
</mat-toolbar>
<main>
  <router-outlet></router-outlet>
</main>
