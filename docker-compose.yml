# Cargo Compliance Gate: full local stack (T11, observability T12).
#   docker compose up -d --build            # everything
#   docker compose up -d postgres kafka topic-init   # infra only, apps via `nx serve`
# Ports are bound to 127.0.0.1 and chosen to avoid cargo-dashboard (3000-3002, 4200, 8080, 27017).
# Only web (4310), api-gateway (3100), kafka-ui (8090), postgres (5433) and kafka's
# external listener (9094) are published. shipment-svc and screening-svc stay on the Compose network.
name: cargo-compliance-gate

services:
  postgres:
    image: postgres:16
    hostname: postgres
    container_name: cargo-compliance-gate-postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only executed on first volume init; existing data is not touched.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    container_name: cargo-compliance-gate-kafka
    ports:
      # External listener for apps running on the Mac. Containers use kafka:9092.
      - "127.0.0.1:9094:9094"
    volumes:
      # Topics, messages and committed consumer offsets survive `down` and
      # container recreation. The image ships this dir owned by appuser, so a
      # fresh named volume inherits writable ownership.
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT = in-compose clients and docker exec; EXTERNAL = host; CONTROLLER = KRaft (not published).
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:9092,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # Fixed on purpose: KRaft stamps the data dir with this ID and refuses to
      # start on a volume formatted for a different cluster.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Only topic-init creates topics (3 partitions). With auto-create on, a
      # running service could re-create a topic with 1 partition after a reset.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  topic-init:
    image: apache/kafka:4.4.0
    container_name: cargo-compliance-gate-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        bootstrap="kafka:9092"
        for topic in shipment.events screening.events hold.events; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server "$$bootstrap" \
            --create --if-not-exists \
            --topic "$$topic" \
            --partitions 3 \
            --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$bootstrap" --list

  # ---- observability (T12) ----

  # Kafka UI: topics, messages (with headers such as x-correlation-id),
  # consumer groups and lag. Read-only, no auth, so it is bound to 127.0.0.1 only.
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: cargo-compliance-gate-kafka-ui
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cargo-compliance-gate
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "true"
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ---- application services (one replica each; scaling is T13/T13b) ----

  shipment-svc:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        APP: shipment-svc
    image: cargo-compliance-gate/shipment-svc:local
    env_file:
      - path: .env
        required: false
    # Container-specific values override .env (which is written for apps on the Mac).
    environment:
      HOST: 0.0.0.0
      PORT: 3101
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgresql://${POSTGRES_USER:-cargo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cargo_compliance}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    healthcheck:
      # No health route on this service; a TCP connect proves Nest is listening
      # (it only listens after migrations ran and Prisma connected).
      test: ["CMD", "node", "-e", "require('net').connect(3101,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  screening-svc:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        APP: screening-svc
    image: cargo-compliance-gate/screening-svc:local
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      SCREENING_SVC_PORT: 3102
      KAFKA_BROKERS: kafka:9092
      SCREENING_DATABASE_URL: postgresql://${POSTGRES_USER:-cargo}:${POSTGRES_PASSWORD}@postgres:5432/cargo_compliance_screening
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3102,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        APP: api-gateway
    image: cargo-compliance-gate/api-gateway:local
    ports:
      - "127.0.0.1:3100:3100"
    env_file:
      - path: .env
        required: false
    # JWT_SECRET comes from .env only (no default in the repo); config validation fails fast without it.
    environment:
      HOST: 0.0.0.0
      GATEWAY_PORT: 3100
      KAFKA_BROKERS: kafka:9092
      SHIPMENT_SVC_URL: http://shipment-svc:3101
      SCREENING_SVC_URL: http://screening-svc:3102
    depends_on:
      kafka:
        condition: service_healthy
      shipment-svc:
        condition: service_healthy
      screening-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: cargo-compliance-gate/web:local
    ports:
      # 4310, not 4300, so `nx serve web` (4300) can run next to the container.
      - "127.0.0.1:4310:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  postgres_data:
  kafka-data:
