# Static host for the Angular build + reverse proxy for /api -> api-gateway.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Using a variable in proxy_pass makes nginx resolve
  # api-gateway per request, so a restarted gateway (new IP) is picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gateway http://api-gateway:3100;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Server-Sent Events: long-lived, must not be buffered or cut off.
  location = /api/stream {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    # The single-use stream token is in the query string; keep it out of logs.
    access_log off;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: unknown paths fall back to index.html so Angular routing works on reload.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed bundles can be cached hard; index.html must not be.
  location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
